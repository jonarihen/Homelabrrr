services:
  postgres:
    # PostgreSQL 17 pairs with the postgresql17-client (pg_dump/pg_restore)
    # installed in the backend image — pg_dump must be >= the server major.
    # Change both together (compose image + backend Dockerfile apk package).
    image: postgres:17-alpine
    container_name: proxmox-frontend-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-homelabrrr}
      - POSTGRES_USER=${POSTGRES_USER:-homelabrrr}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homelabrrr} -d ${POSTGRES_DB:-homelabrrr}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal

  backend:
    build: ./backend
    container_name: proxmox-frontend-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY must be set in .env}
      - SECRET_ENCRYPTION_KEY_ID=${SECRET_ENCRYPTION_KEY_ID:-primary}
      - SECRET_ENCRYPTION_PREVIOUS_KEYS=${SECRET_ENCRYPTION_PREVIOUS_KEYS:-}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Homelabrrr}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      # 2 hops in the recommended topology: external reverse proxy (Caddy/NPM)
      # + the bundled frontend nginx. Set to 1 if clients hit port 8181 directly
      # (no external proxy), otherwise X-Forwarded-For can be spoofed.
      - TRUST_PROXY=${TRUST_PROXY:-2}
      - ALLOW_INSECURE_UPSTREAM_TLS=${ALLOW_INSECURE_UPSTREAM_TLS:-false}
      - ALLOW_INTERNAL_IMAGE_URLS=${ALLOW_INTERNAL_IMAGE_URLS:-false}
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      # Absolute portal URL for "open in portal" links in Discord embeds.
      # Falls back to ALLOWED_ORIGIN when empty.
      - PORTAL_BASE_URL=${PORTAL_BASE_URL:-}
      # Background timers. Every value here is also the code's own default, so
      # leaving them out of .env changes nothing.
      - NODE_HEALTH_POLL_MS=${NODE_HEALTH_POLL_MS:-60000}
      - LEASE_CHECK_INTERVAL_MS=${LEASE_CHECK_INTERVAL_MS:-900000}
      - WEBSITE_RECONCILE_INTERVAL_MS=${WEBSITE_RECONCILE_INTERVAL_MS:-300000}
      - VM_SCHEDULE_SHUTDOWN_TIMEOUT_MS=${VM_SCHEDULE_SHUTDOWN_TIMEOUT_MS:-120000}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-365}
      - JOB_RETENTION_DAYS=${JOB_RETENTION_DAYS:-90}
      - BACKUP_DIR=${BACKUP_DIR:-/app/backups}
      - BACKUP_OFFSITE_DIR=${BACKUP_OFFSITE_DIR:-/app/backups-offsite}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - BACKUP_INTERVAL_MS=${BACKUP_INTERVAL_MS:-86400000}
      - PORT=3000
      # PostgreSQL connection. Points at the postgres service on the internal
      # network; the password comes from POSTGRES_PASSWORD in .env.
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-homelabrrr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-homelabrrr}}
      - PG_POOL_SIZE=${PG_POOL_SIZE:-10}
      # Legacy SQLite path. On the first boot of an empty PostgreSQL database,
      # if this file exists (an existing install's db_data volume), the backend
      # imports it automatically — so upgrading is a plain `compose up`. Set
      # AUTO_IMPORT_SQLITE=false to skip it. Ignored once data is present.
      - DB_PATH=${DB_PATH:-/app/data/db.sqlite}
      - AUTO_IMPORT_SQLITE=${AUTO_IMPORT_SQLITE:-auto}
    volumes:
      # db_data is kept for one release as the SQLite import source / rollback
      # artifact; the running server no longer writes to it.
      - db_data:/app/data
      - ${BACKUP_HOST_PATH:-./backups}:/app/backups
      - ${BACKUP_OFFSITE_HOST_PATH:-./backups-offsite}:/app/backups-offsite
    # /api/health/ready is unauthenticated and only answers 200 once migrations
    # have applied and the server is listening. start_period covers that window:
    # probes that fail inside it don't count against `retries`, while a probe
    # that succeeds marks the container healthy immediately.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: proxmox-frontend-ui
    restart: unless-stopped
    ports:
      - target: 80
        published: 8181
        protocol: tcp
        host_ip: ${FRONTEND_BIND_ADDRESS:-127.0.0.1}
    # nginx resolves the backend upstream at request time, but waiting for the
    # health check means the first page load can't land on a backend that is
    # still migrating.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  pg_data:
  db_data:

networks:
  internal:
    driver: bridge
