map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CSP: Google Fonts (AARIS typography in index.html); 'unsafe-inline' styles
  # for React/xterm/noVNC inline styling; data: images for the 2FA QR code;
  # ws:/wss: for the VNC/SSH console proxies behind any reverse-proxy hostname.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Hide nginx version
  server_tokens off;

  # Upstream settings shared by both /api/ locations below — nginx only inherits
  # these into a location that declares no proxy_set_header of its own.
  proxy_http_version 1.1;
  proxy_set_header   Upgrade           $http_upgrade;
  proxy_set_header   Connection        $connection_upgrade;
  proxy_set_header   Host              $host;
  proxy_set_header   X-Real-IP         $remote_addr;
  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  # SFTP uploads stream straight through to the backend, which pipes them into
  # the remote SFTP write stream. Buffering the body here would spool the whole
  # file to disk in this container before the backend saw a byte, and
  # client_max_body_size would cap it — so both are off and the remote disk is
  # the only limit. Exact match, so it wins over the /api/ prefix below.
  location = /api/sftp/upload {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_pass http://backend:3000;
  }

  # Proxy all other API + WebSocket requests to the backend
  location /api/ {
    client_max_body_size 105m;
    proxy_pass http://backend:3000;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
