name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      # pg_dump/pg_restore for the backup-pipeline test. Their major version
      # must be >= the postgres:17 service — pg_dump refuses to dump a server
      # newer than itself. Two things make that awkward on ubuntu-24.04:
      #   * the archive only carries client 16, and the runner image has no
      #     PGDG apt source of its own, so 17 has to be pulled from PGDG;
      #   * /usr/bin/pg_dump is postgresql-client-common's pg_wrapper, and the
      #     runner's version of that package predates 17, so its
      #     "use the newest installed" logic still resolves to 16 however many
      #     later clients are installed. Hence the explicit bin directory on
      #     PATH rather than trusting the wrapper.
      # If this ever drifts again the tests skip with a reason rather than
      # failing — see pgToolsSkipReason in backend/src/utils/encryptedBackup.test.ts.
      - name: Install pg_dump/pg_restore matching the postgres service
        run: |
          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      # Separate step so $GITHUB_PATH is in effect — proves which client won.
      - run: pg_dump --version
      - run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f backend/Dockerfile backend
      - run: docker build -f frontend/Dockerfile .
