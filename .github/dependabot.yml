version: 2

# Keep routine version maintenance reviewable: Dependabot opens one combined
# monthly PR across the project. Security updates remain immediate and use
# Dependabot's separate security-update PR limit.
multi-ecosystem-groups:
  monthly-maintenance:
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: npm
    directory: /backend
    patterns: ["*"]
    multi-ecosystem-group: monthly-maintenance
    ignore:
      # typescript-eslint pins its TypeScript peer range (currently <6.1.0);
      # a TypeScript major lands only together with a typescript-eslint that supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: monthly-maintenance
  - package-ecosystem: docker
    directory: /backend
    patterns: ["*"]
    multi-ecosystem-group: monthly-maintenance
  - package-ecosystem: docker
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: monthly-maintenance
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly-maintenance
