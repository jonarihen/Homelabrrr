version: 2

# Keep routine version maintenance reviewable: Dependabot opens one combined
# monthly PR across the project. Security updates remain immediate and use
# Dependabot's separate security-update PR limit.
multi-ecosystem-groups:
  monthly-maintenance:
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: npm
    directory: /backend
    patterns: ["*"]
    multi-ecosystem-group: monthly-maintenance
    ignore:
      # otplib 13 enforces a 16-byte minimum on TOTP secrets. Every secret in
      # users.totp_secret was generated by otplib 12 at 10 bytes, so 13 refuses
      # all of them and locks every enrolled user out of sign-in. Taking it
      # needs a re-enrollment path for those secrets, not a version bump.
      # Drop this entry once that migration lands.
      - dependency-name: otplib
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: monthly-maintenance
  - package-ecosystem: docker
    directory: /backend
    patterns: ["*"]
    multi-ecosystem-group: monthly-maintenance
  - package-ecosystem: docker
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: monthly-maintenance
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly-maintenance
